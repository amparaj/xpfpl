# Saves Polymarket's live odds as odds.json on the `odds` branch, for the website's Markets page.
# The browser never calls Polymarket itself: it's blocked on some networks (Australian ISPs among
# them), and GitHub's runners aren't. The page reads the file through raw.githubusercontent.com,
# which allows requests from any website and caches for 5 minutes.
#
# Every 5 minutes (the shortest schedule GitHub allows; runs are often a few minutes late):
# ~100 requests to Polymarket's public APIs a run, well under their rate limits. The file lives on
# its own branch rather than gh-pages because every gh-pages push rebuilds the site, and Pages has
# a soft limit of 10 builds an hour. The branch is one commit, replaced each run, so it doesn't grow.
#
# Scheduled workflows only run from the default branch, and GitHub pauses them after 60 days
# without activity in the repo.
name: Odds snapshot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odds-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: web

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # The club codes come from the published site's meta.json. Node runs web/src/polymarket.ts
      # directly (it strips the types), so there's no npm install.
      - name: Fetch the odds
        run: |
          mkdir -p "$RUNNER_TEMP/odds"
          git fetch --quiet --depth=1 origin gh-pages
          git show FETCH_HEAD:data/meta.json > "$RUNNER_TEMP/meta.json"
          node web/scripts/odds-snapshot.ts "$RUNNER_TEMP/meta.json" "$RUNNER_TEMP/odds/odds.json"

      - name: Replace the odds branch
        working-directory: ${{ runner.temp }}/odds
        run: |
          git init --quiet -b odds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odds.json
          git commit --quiet -m "Odds $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:odds
        env:
          GH_TOKEN: ${{ github.token }}
