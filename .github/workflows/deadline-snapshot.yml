# Saves every player's price, injury news, chance of playing and ownership shortly before each FPL
# deadline (archive/fpl/<season>/deadlines/gwNN.parquet). The FPL API only ever shows the current
# values, so this is the only way to keep them. Runs every two hours and snapshots only when the
# next deadline is under three hours away, so each gameweek gets one or two commits.
#
# main only accepts changes through pull requests, so the snapshots go to the unprotected
# `deadline-snapshots` branch. `xpfpl fetch` and `xpfpl archive` copy them into your working tree
# (archive.pull_snapshots), and they reach main with your next pull request.
#
# Scheduled workflows only run from the default branch.
name: Deadline snapshot

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Snapshot now, however far away the deadline is"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deadline-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Only what archive.py needs: installing the package's own dependencies would pull in torch.
      - name: Install
        run: |
          pip install --quiet pandas pyarrow requests
          pip install --quiet --no-deps -e .

      - name: Snapshot
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python -m xpfpl.data.archive deadline
          else
            python -m xpfpl.data.archive deadline --within-hours 3
          fi

      - name: Commit to the deadline-snapshots branch
        run: |
          # Only the files this run wrote: main's older copies must not overwrite the branch's.
          changed=$(git status --porcelain --untracked-files=all -- archive/fpl | awk '{print $2}' | grep '/deadlines/' || true)
          if [ -z "$changed" ]; then
            echo "Nothing new."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/snap"
          for f in $changed; do mkdir -p "$RUNNER_TEMP/snap/$(dirname "$f")"; cp "$f" "$RUNNER_TEMP/snap/$f"; done
          git stash --include-untracked --quiet
          if git fetch --quiet origin deadline-snapshots 2>/dev/null; then
            git checkout --quiet -B deadline-snapshots FETCH_HEAD
          else
            git checkout --quiet -b deadline-snapshots      # first run: start the branch from main
          fi
          cp -r "$RUNNER_TEMP/snap/archive/." archive/
          git add -- $changed
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "Deadline snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet origin deadline-snapshots
          echo "Pushed: $changed"
